name: CI
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run docs:build
      - run: |
          pnpm pack --pack-destination artifacts
          node scripts/check-package.mjs artifacts/*.tgz
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
      - run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
        working-directory: example/android
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      RCT_USE_RN_DEP: '1'
      RCT_USE_PREBUILT_RNCORE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.4.8'
      - run: |
          bundle install
          bundle exec pod install --project-directory=ios
        working-directory: example
      - run: >-
          xcodebuild -workspace ios/HingesExample.xcworkspace
          -scheme HingesExample -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: example
